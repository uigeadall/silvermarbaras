# Render Blueprint for Marbaras
# This file is optional but helps with automated setup

services:
  - type: web
    name: marbaras
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: False
      - key: DJANGO_ALLOWED_HOSTS
        value: marbaras.onrender.com,*.onrender.com
    buildCommand: ""
    startCommand: ""

databases:
  - name: marbaras-db
    databaseName: marbaras
    user: marbaras

