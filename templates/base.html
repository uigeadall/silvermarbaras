{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}Marbaras{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: '#111827' },
          boxShadow: {
            card: '0 8px 24px rgba(15,23,42,.08)',
            soft: '0 1px 2px rgba(0,0,0,.05)'
          },
          borderRadius: { xl2: '1rem' },
          maxWidth: { site: '1600px' }
        }
      }
    }
  </script>

  <style>
    .cart-tip::after{
      content:""; position:absolute; top:-6px; left:50%; transform:translateX(-50%);
      border:6px solid transparent; border-bottom-color:#0b1220;
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>

<!-- Make page a flex column so footer is tight at bottom -->
<body class="min-h-screen flex flex-col bg-white text-slate-900 antialiased">

  <!-- No top navbar -->

  <!-- Reduce bottom padding so there isn't a big band above the footer -->
  <main class="flex-1 pt-6 pb-2">
    <div class="mx-auto max-w-site px-4 space-y-4">
      {% if messages %}
        <div class="space-y-2">
          {% for message in messages %}
            <div class="rounded-xl border border-indigo-200 bg-indigo-50 text-indigo-800 px-4 py-3 text-sm shadow-soft transition-opacity duration-500">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}

      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="border-t border-slate-200">
  <div class="mx-auto max-w-site px-4 py-2 text-[11px] leading-tight flex items-center justify-between text-slate-600">
    <nav class="flex gap-4">
      <a href="{% url 'terms' %}" class="hover:text-slate-900">Terms</a>
      <a href="{% url 'privacy' %}" class="hover:text-slate-900">Privacy</a>
      <a href="{% url 'contact' %}" class="hover:text-slate-900">Contact</a>
    </nav>
    <span>© {% now "Y" %} Marbaras</span>
  </div>
</footer>


  <script>
    setTimeout(() => {
      document.querySelectorAll('.bg-indigo-50').forEach(el => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 500);
      });
    }, 2200);
  </script>

  {% block extra_js %}{% endblock %}
</body>
</html>
