{% extends "base.html" %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<style>
  .signup-container {
    max-width: 400px;
    margin: 80px auto;
    padding: 30px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
    font-family: 'Segoe UI', sans-serif;
  }

  .signup-container h2 {
    margin-bottom: 24px;
    text-align: center;
    color: #333;
  }

</style>

<div class="signup-container">
  <h2>Sign Up</h2>


  <form method="post" action="{% url 'account_signup' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign up with Email</button>
  </form>
</div>
{% endblock %}
