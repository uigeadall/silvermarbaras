{% extends "base.html" %}
{% load static %}

{% block title %}✅ Order Details - Marbaras{% endblock %}

{% block content %}
<style>
  .order-success-container {
    max-width: 600px;
    margin: 60px auto;
    padding: 24px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }

  .order-success-container h2 {
    text-align: center;
    margin-bottom: 20px;
  }

  .order-success-container p {
    text-align: center;
    margin-bottom: 20px;
    font-size: 1.1rem;
    color: #555;
  }

  .order-success-container .home-link {
    display: block;
    width: fit-content;
    margin: 0 auto;
    padding: 10px 20px;
    background-color: #555;
    color: white;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    text-align: center;
  }

  .order-success-container .home-link:hover {
    background-color: #444;
  }
</style>

<div class="order-success-container">
  <h2>🎉 Thank You for Your Order!</h2>
  <p>We appreciate your purchase and hope you enjoy your jewelry.</p>

  <a href="{% url 'home' %}" class="home-link">⬅ Go Back to Home</a>
</div>
{% endblock %}
