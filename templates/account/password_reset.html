{% extends "base.html" %}
{% load static %}
{% load i18n %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<style>
  body {
    background-color: #f5f5f5;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  .reset-wrapper {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .reset-box {
    background: #fff;
    padding: 40px 30px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    width: 100%;
    max-width: 400px;
    text-align: center;
  }

  .reset-box h2 {
    font-size: 1.8rem;
    margin-bottom: 24px;
    color: #333;
  }

  form {
    text-align: left;
    margin-bottom: 20px;
  }

  form p {
    margin-bottom: 15px;
  }

  input[type="email"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 0.95rem;
  }

  button[type="submit"] {
    width: 100%;
    padding: 10px;
    background-color: #333;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
    transition: background-color 0.2s ease-in-out;
  }

  button[type="submit"]:hover {
    background-color: #111;
  }

  .info-text {
    color: #666;
    font-size: 0.95rem;
    margin-bottom: 20px;
  }

</style>

<div class="reset-wrapper">
  <div class="reset-box">
    <h2>{% trans "Reset Password" %}</h2>

    <p class="info-text">{% trans "Enter your email address and we'll send you a link to reset your password." %}</p>

    <form method="POST" action="{% url 'account_reset_password' %}">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">{% trans "Send Reset Email" %}</button>
    </form>
  </div>
</div>
{% endblock %}
