{% extends "base.html" %}
{% load socialaccount %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<style>
  body {
    background-color: #f5f5f5;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  .auth-wrapper {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .auth-box {
    background: #fff;
    padding: 40px 30px;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    width: 100%;
    max-width: 400px;
    text-align: center;
  }

  .auth-box h2 {
    font-size: 1.8rem;
    margin-bottom: 24px;
    color: #333;
  }

  form {
    text-align: left;
    margin-bottom: 20px;
  }

  form p {
    margin-bottom: 15px;
  }

  input[type="text"],
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 0.95rem;
  }

  button[type="submit"] {
    width: 100%;
    padding: 10px;
    background-color: #333;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
    transition: background-color 0.2s ease-in-out;
  }

  button[type="submit"]:hover {
    background-color: #111;
  }

  .or-divider {
    margin: 20px 0;
    font-size: 0.95rem;
    color: #777;
    position: relative;
  }

  .google-btn,
  .facebook-btn {
    background: white;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 10px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 500;
    font-size: 0.95rem;
    text-decoration: none;
    color: #444;
    transition: background-color 0.2s ease-in-out;
    margin-bottom: 10px;
  }

  .google-btn img,
  .facebook-btn img {
    height: 20px;
    margin-right: 10px;
  }

  .google-btn:hover,
  .facebook-btn:hover {
    background-color: #f1f1f1;
  }

  ul.helptext {
    display: none !important;
  }
</style>

<div class="auth-wrapper">
  <div class="auth-box">
    <h2>Sign Up</h2>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Sign Up</button>
    </form>

    <div class="or-divider">Or sign up with:</div>

    <a href="{% provider_login_url 'google' %}" class="google-btn">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google logo">
      Sign up with Google
    </a>

    <a href="{% provider_login_url 'facebook' %}" class="facebook-btn">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/facebook/facebook-original.svg" alt="Facebook logo">
      Sign up with Facebook
    </a>
  </div>
</div>
{% endblock %}
