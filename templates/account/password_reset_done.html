{% extends "base.html" %}
{% load static %}

{% block title %}Password Reset Sent{% endblock %}

{% block content %}
<style>
  .reset-wrapper {
    min-height: 70vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .reset-box {
    background: #fff;
    padding: 40px 30px;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    max-width: 480px;
    width: 100%;
    text-align: center;
    font-family: 'Segoe UI', sans-serif;
  }

  .reset-box h2 {
    font-size: 1.8rem;
    margin-bottom: 16px;
    color: #222;
  }

  .reset-box p {
    font-size: 1rem;
    color: #555;
    margin-bottom: 24px;
  }

  .reset-box a {
    display: inline-block;
    padding: 10px 20px;
    background-color: #111;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    transition: background 0.2s ease;
  }

  .reset-box a:hover {
    background-color: #333;
  }
</style>

<div class="reset-wrapper">
  <div class="reset-box">
    <h2>Password Reset Email Sent</h2>
    <p>If an account with that email exists, you’ll receive a password reset link shortly.</p>
    <a href="{% url 'login' %}">Return to Login</a>
  </div>
</div>
{% endblock %}
