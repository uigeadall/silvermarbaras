{% extends "base.html" %}
{% load static %}

{% block title %}Logout{% endblock %}

{% block content %}
<style>
  .logout-container {
    max-width: 500px;
    margin: 80px auto;
    padding: 40px;
    text-align: center;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }

  .logout-container h2 {
    font-size: 1.8rem;
    margin-bottom: 20px;
    color: #222;
  }

  .logout-container p {
    font-size: 1rem;
    color: #555;
    margin-bottom: 30px;
  }

  .logout-container form button {
    text-decoration: none;
    background: #000;
    color: #fff;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: bold;
    border: none;
    transition: background 0.3s ease;
    cursor: pointer;
  }

  .logout-container form button:hover {
    background: #444;
  }
</style>

<div class="logout-container">
  <h2>Logging Out</h2>
  <p>Are you sure you want to log out?</p>
  <form method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    <button type="submit">Logout</button>
  </form>
</div>
{% endblock %}
